services:
  - type: web
    name: haru88bot
    env: node
    region: singapore
    branch: main
    buildCommand: corepack enable && corepack prepare pnpm@10.32.1 --activate && pnpm --filter @workspace/admin-panel run build && pnpm --filter @workspace/api-server run build
    startCommand: corepack enable && corepack prepare pnpm@10.32.1 --activate && pnpm --filter @workspace/api-server run start
